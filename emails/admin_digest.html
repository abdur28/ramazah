<tr><td style="padding:26px 34px 0;">
  <div style="font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:34px;font-weight:400;color:#2A2E24;line-height:1.12;">This morning</div>
  <div style="font-family:Jost,'Helvetica Neue',Arial,sans-serif;font-size:15px;color:#6B7060;line-height:1.7;padding-top:10px;">{{today}}</div>
</td></tr>

<tr><td style="padding:24px 34px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="font-family:Jost,'Helvetica Neue',Arial,sans-serif;">
    {{#each rows}}
    <tr>
      <td style="padding:12px 0;border-top:1px solid #E4E3D8;">
        <div style="font-size:15px;color:#2A2E24;">{{label}}</div>
        {{#if note}}<div style="font-size:13px;color:#6B7060;padding-top:2px;">{{note}}</div>{{/if}}
      </td>
      <td align="right" valign="top" style="padding:12px 0;border-top:1px solid #E4E3D8;font-size:22px;color:{{#if urgent}}#9C5433{{else}}#2A2E24{{/if}};">{{value}}</td>
    </tr>
    {{/each}}
  </table>
</td></tr>

<tr><td style="padding:24px 34px 0;">{{> button url=adminUrl label="Open the admin" secondary=true}}</td></tr>
