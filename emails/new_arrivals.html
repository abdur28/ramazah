<tr><td style="padding:26px 34px 0;">
  <div style="font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:34px;font-weight:400;color:#2A2E24;line-height:1.12;">{{#if headline}}{{headline}}{{else}}Just back from the run.{{/if}}</div>
  <div style="font-family:Jost,'Helvetica Neue',Arial,sans-serif;font-size:15px;color:#6B7060;line-height:1.7;padding-top:12px;">
    {{#if intro}}{{intro}}{{else}}A few things came back with us this time. They are on the site now.{{/if}}
  </div>
</td></tr>

<tr><td style="padding:24px 34px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
    {{#each products}}
    <tr>
      <td width="88" valign="top" style="padding:0 14px 16px 0;">
        {{#if imageUrl}}<img src="{{imageUrl}}" width="88" alt="" style="display:block;width:88px;height:88px;object-fit:cover;border-radius:4px;border:1px solid #E4E3D8;" />{{/if}}
      </td>
      <td valign="top" style="padding:0 0 16px;font-family:Jost,'Helvetica Neue',Arial,sans-serif;">
        <a href="{{url}}" style="font-size:15px;color:#2A2E24;text-decoration:none;">{{name}}</a>
        <div style="font-size:14px;color:#6B7060;padding-top:4px;">{{price}}</div>
      </td>
    </tr>
    {{/each}}
  </table>
</td></tr>

<tr><td style="padding:8px 34px 0;">{{> button url=websiteUrl label="See everything new"}}</td></tr>
