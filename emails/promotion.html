<tr><td style="padding:26px 34px 0;">
  <div style="font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-size:34px;font-weight:400;color:#2A2E24;line-height:1.12;">{{headline}}</div>
  <div style="font-family:Jost,'Helvetica Neue',Arial,sans-serif;font-size:15px;color:#6B7060;line-height:1.75;padding-top:14px;">{{{bodyHtml}}}</div>
</td></tr>

{{#if discountCode}}
<tr><td style="padding:24px 34px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#EFF1E9;border-radius:4px;">
    <tr><td align="center" style="padding:22px;font-family:Jost,'Helvetica Neue',Arial,sans-serif;">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.2em;color:#6B7060;">Use the code</div>
      <div style="font-size:26px;color:#2A2E24;letter-spacing:.14em;padding-top:8px;">{{discountCode}}</div>
      {{#if expiryDate}}<div style="font-size:13px;color:#6B7060;padding-top:8px;">Until {{expiryDate}}</div>{{/if}}
    </td></tr>
  </table>
</td></tr>
{{/if}}

<tr><td style="padding:24px 34px 0;">{{> button url=ctaUrl label=ctaLabel}}</td></tr>
